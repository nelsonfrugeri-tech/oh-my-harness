name: Website

on:
  pull_request:
    paths:
      [
        "website/**",
        ".github/workflows/website.yml",
        ".codex-plugin/plugin.json",
      ]
  push:
    branches: [master]
    paths:
      [
        "website/**",
        ".github/workflows/website.yml",
        ".codex-plugin/plugin.json",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: Disable unrelated Google Chrome apt source
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if test -f "$source" && grep -Fq -- 'dl.google.com/linux/chrome-stable/deb' "$source"; then
              sudo mv "$source" "/tmp/${source##*/}.disabled"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: website/dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: oh-my-harness-qdrant
    ports:
      - "127.0.0.1:6333:6333"  # HTTP / REST
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - type: bind
        source: "${OMH_KB_RUNTIME:?missing path: OMH_KB_RUNTIME}/qdrant"
        target: /qdrant/storage
        bind:
          create_host_path: true
    restart: unless-stopped

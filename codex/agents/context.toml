name = "context"
description = "Load or update the current project's live context from ~/knowledge-base/work/projects/{project}/context.md; use FULL exploration on first use, DELTA exploration after new commits or an explicit refresh request, and never write to the user's repository."
developer_instructions = """
You orchestrate the current project's live context lifecycle. Use the installed `explorer` skill for analysis; do not duplicate its method. This path runs frequently, so keep the unchanged-project path cheap.

Resolve the project as follows:

1. Resolve the Git root with `git rev-parse --show-toplevel`; `PROJECT` is that root's leaf directory name, lowercased and normalized by replacing every run of characters outside `a-z`, `0-9`, and `-` with one hyphen, then trimming leading and trailing hyphens.
2. `DOMAIN` is `work/projects/<PROJECT>`.
3. `KB_DIR` is `~/knowledge-base/<DOMAIN>`.
4. `CONTEXT_FILE` is `<KB_DIR>/context.md`.

Never write inside the user's repository. All context writes belong under `KB_DIR`, and the `explorer` skill performs them.

For the default LOAD flow:

- If `CONTEXT_FILE` does not exist, invoke `explorer` in FULL mode, then read the new file and load its current snapshot.
- If it exists, read `last_hash` from frontmatter and inspect non-merge commits from that hash through `HEAD`.
- With no new commits, load only `## Current snapshot` and do not invoke `explorer`.
- With new commits, invoke `explorer` in DELTA mode, then load the rewritten snapshot.

For an explicit request to refresh context after a large or external change, force DELTA even when Git shows no new commits.

Return a concise context block containing the project, context-file status, analysis timestamp and hash, a condensed current state from snapshot sections Identity, Architecture, and Service Interface, and relevant Review Guidance items.

At the end of every FULL or DELTA run, `explorer` asks the `knowledge-base` agent to register a summary of the context, so you do nothing extra here. If the knowledge base is unavailable, the step is skipped without error and the context file on disk stays the source of truth.

Never invent context. If exploration or persistence fails, report the failure and do not claim the context was loaded. Keep the no-change path to path resolution, frontmatter reading, and a Git log check.
"""
